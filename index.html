<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04263a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Jadi Ikan — Kontrol dengan Gerakan Mulut</title>
<link rel="stylesheet" href="style.css?v=1.1">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="score">0</div>
    <div id="hint"></div>
    <div id="camwrap">
      <video id="cam" playsinline autoplay muted></video>
      <div id="jaw"><div id="jawfill"></div></div>
      <div id="camnote">Wajah belum terdeteksi</div>
    </div>
  </div>

  <div class="screen" id="screen-start">
    <div class="card">
      <div class="logo">🐟</div>
      <h1>JADI<br>IKAN</h1>
      <p class="sub">Hindari kail pancing. Kontrol menggunakan <b>gerakan wajah kamu</b>:<br>
        <span class="tag up">BUKA MULUT = NAIK</span> <span class="tag down">TUTUP MULUT = TURUN</span></p>
      <button class="btn primary" id="btn-cam">Nyalakan Kamera</button>
      <button class="btn ghost" id="btn-touch">Main dengan sentuhan</button>
      <p class="err" id="cam-err"></p>
    </div>
  </div>

  <div class="screen hidden" id="screen-over">
    <div class="card">
      <div class="logo">🪝</div>
      <h2>Kena Pancing!</h2>
      <div class="stats">
        <div><span id="final-score">0</span><label>Skor</label></div>
        <div><span id="best-score">0</span><label>Terbaik</label></div>
      </div>
      <div id="snaps" class="hidden">
        <p class="snap-cap">Ekspresi lucu kamu 📸</p>
        <div id="snap-row"></div>
      </div>
      <button class="btn share" id="btn-share">Bagikan ke Media Sosial</button>
      <p class="err" id="share-note"></p>
      <button class="btn primary" id="btn-retry">Main Lagi</button>
      <p class="err" id="over-note"></p>
    </div>
  </div>
</div>
<script type="module" src="game.js?v=1.1"></script>
</body>
</html>
